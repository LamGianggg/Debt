name: Build & Verify (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-build:
    name: Backend (Java 17 Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & Test Backend
        run: |
          cd Backend
          mvn clean test "-Djacoco.skip=true"
          mvn package -DskipTests

  frontend-build:
    name: Frontend (React Vite Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      - name: Install & Build Frontend
        run: |
          cd Frontend
          npm ci
          npm run build
