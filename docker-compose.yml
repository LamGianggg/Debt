version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: debtmaster-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'cactus_db'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: debtmaster-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cactus_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - '8080:8080'
    depends_on:
      - mysql

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: debtmaster-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mysql_data:
