spring.application.name=cactus-practice-backend-test
server.port=0

# H2 in-memory Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate with H2 Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=cactusPracticeSuperSecretJwtKey2026SecureKeyWithSufficientLengthForHS512Algorithm!
jwt.expirationMs=86400000

# App properties
app.version=1.0.0
app.title=Cactus Practice Test
app.description=Test application properties
