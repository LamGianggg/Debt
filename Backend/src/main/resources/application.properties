spring.application.name=cactus-practice-backend

# Server Configuration
server.port=8080

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/cactus_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson / JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# JWT Configuration
jwt.secret=cactusPracticeSuperSecretJwtKey2026SecureKeyWithSufficientLengthForHS512Algorithm!
jwt.expirationMs=86400000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
app.version=1.0.0
app.title=Cactus Practice Healthcare Payment API
app.description=REST API for Cactus Practice healthcare billing, transactions, customers, payouts, and reports.
